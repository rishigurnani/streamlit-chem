syntax = "proto3";

// st.molecule
message Molecule {
  // The 2D structure rendered server-side by RDKit as a self-contained SVG
  // string. Rendering happens in Python so the frontend stays a thin,
  // dependency-free viewer.
  string svg = 1;

  // Optional caption displayed beneath the structure (e.g. a compound name).
  string caption = 2;
}
